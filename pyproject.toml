[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ailib"
version = "0.1.0"
description = "Primitives built from scratch on the way to AI engineering"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools]
packages = ["ailib"]
